# BikeFlow configuration. All tunable values live here, never inline in code.

seed: 42

data:
  url: https://archive.ics.uci.edu/static/public/560/seoul+bike+sharing+demand.zip
  csv_name: SeoulBikeData.csv
  encoding: cp1252
  raw_dir: data/raw
  processed_dir: data/processed
  expected_rows: 8760
  expected_sha256: 373339b71a8935d69e9af0abf26a70744632119862eeb3919efb389a7b749c60

split:
  train: ["2017-12-01", "2018-07-31"]
  validation: ["2018-08-01", "2018-09-30"]
  test: ["2018-10-01", "2018-11-30"]

# How the champion is chosen. A single validation window rewards whichever model
# happens to suit those two months: HGB wins Aug-Sep by a wide margin and loses
# the two folds before it. Averaging over rolling-origin folds removes that
# accident. Every fold trains on the past and scores on the future, and no fold
# may touch the test period (enforced in code).
selection:
  strategy: rolling_cv        # rolling_cv | validation
  metric: mae                 # primary metric; WAPE ranks identically within a window
  inner_weeks: 6              # held out inside each fold for early stopping
  folds:
    - ["2018-04-01", "2018-05-31"]
    - ["2018-06-01", "2018-07-31"]
    - ["2018-08-01", "2018-09-30"]

# MLflow: one run per training; the champion is registered as a new version of
# `registered_model` and receives `alias`. The store is set by MLFLOW_TRACKING_URI,
# or a local mlflow.db file when it is unset.
tracking:
  experiment: bikeflow
  registered_model: bikeflow-demand
  alias: champion

# Drift monitoring over the prediction journal. The reference is the validation
# split with the served model's own predictions, stored inside the model artifact.
monitoring:
  window_hours: 168           # last 7 days of predictions with a known actual demand
  min_rows: 72                # fewer rows than this are not enough to judge
  # Concept drift: window MAE / validation MAE. Across every 7-day window of the
  # validation split the ratio never exceeded 1.54, so 1.6 means "worse than any
  # week the model showed on data it was validated on".
  concept_drift_mae_ratio: 1.6
  # Data and target drift use Evidently's normed Wasserstein distance, fixed here
  # so the rule does not change with sample size. A column drifts at or above
  # `drift_threshold`; the data drifts when that holds for `data_drift_share` of
  # the weather features.
  drift_threshold: 0.1
  data_drift_share: 0.5

# Retraining on history plus the production journal. The champion and the
# challenger are compared on the latest `holdout_hours` of the journal, which the
# challenger never sees; the `early_stopping_hours` before them drive early stopping.
retraining:
  auto: true                  # retrain when a drift check finds concept drift
  # The last two windows of the journal stay out of training, so a shorter window
  # lets a challenger learn a change sooner. Measured on the 2.5x November evening
  # promotion: with 72 h windows the first challenger to pass the gate comes on
  # 13 November (+17.6 %), with 168 h windows only on 25 November (+16.4 %).
  holdout_hours: 72
  early_stopping_hours: 72
  # After a retraining, the next automatic one waits for this much new data, so a
  # rejected challenger is not retried on every drift check.
  cooldown_hours: 72
  # Quality gate: the challenger replaces the champion only if it lowers holdout
  # MAE by at least this share. Challengers that had not yet seen the change
  # scored between -4.3 % and +3.1 %.
  min_improvement: 0.05

target: rented_bike_count

features:
  # `month` is deliberately excluded. Under the temporal split train holds months
  # 12 and 1-7 only, so months 8-11 reach the model as levels that never received
  # a gradient. Season plus the weather columns carry the same information in a
  # form that survives the split. See reports/model_selection.md.
  categorical: [hour, day_of_week, season]
  numeric:
    - temperature
    - humidity
    - wind_speed
    - visibility
    - dew_point
    - solar_radiation
    - rainfall
    - snowfall
    - is_holiday

business_metric:
  # Underprediction hurts more than overprediction: empty docks mean lost rides.
  under_weight: 3.0
  over_weight: 1.0

models:
  baseline:
    keys: [hour, day_of_week]

  hgb:
    loss: poisson
    max_iter: 400
    learning_rate: 0.06
    max_leaf_nodes: 31
    min_samples_leaf: 20
    l2_regularization: 1.0
    early_stopping: true
    n_iter_no_change: 30

  mlp:
    encodings: [onehot, embedding]
    embedding_dims:
      hour: 4
      day_of_week: 3
      month: 3
      season: 2
    hidden: [128, 64]
    dropout: 0.1
    learning_rate: 0.003
    weight_decay: 0.0001
    batch_size: 256
    max_epochs: 300
    patience: 25

paths:
  models_dir: models
  reports_dir: reports
  production_model: models/model.joblib
