[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bikeflow"
version = "0.1.0"
description = "BikeFlow hourly bike-rental demand API scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "joblib==1.4.2",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "pydantic-settings==2.7.1",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "ruff==0.9.4",
]
# Offline data preparation and reports. CPU PyTorch is installed explicitly from
# its CPU-only index in CI and Docker, then validated against the pinned extra.
ml = [
    "matplotlib==3.10.0",
    "pyarrow==18.1.0",
    "requests==2.32.3",
    "tabulate==0.9.0",
]
mlp = [
    "torch==2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
