      size: 98313
      nfiles: 22
    params:
      params.yaml:
        business_metric:
          under_weight: 3.0
          over_weight: 1.0
        features:
          categorical:
          - hour
          - day_of_week
          - season
          numeric:
          - temperature
          - humidity
          - wind_speed
          - visibility
          - dew_point
          - solar_radiation
          - rainfall
          - snowfall
          - is_holiday
        models:
          baseline:
            keys:
            - hour
            - day_of_week
          hgb:
            loss: poisson
            max_iter: 400
            learning_rate: 0.06
            max_leaf_nodes: 31
            min_samples_leaf: 20
            l2_regularization: 1.0
            early_stopping: true
            n_iter_no_change: 30
          mlp:
            encodings:
            - onehot
            - embedding
            embedding_dims:
              hour: 4
              day_of_week: 3
              month: 3
              season: 2
            hidden:
            - 128
            - 64
            dropout: 0.1
            learning_rate: 0.003
            weight_decay: 0.0001
            batch_size: 256
            max_epochs: 300
            patience: 25
        seed: 42
        selection:
          strategy: rolling_cv
          metric: mae
          inner_weeks: 6
          folds:
          - - '2018-04-01'
            - '2018-05-31'
          - - '2018-06-01'
            - '2018-07-31'
          - - '2018-08-01'
            - '2018-09-30'
        target: rented_bike_count
