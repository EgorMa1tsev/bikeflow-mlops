services:
  api:
    build:
      context: .
      target: runtime
    image: bikeflow:local
    environment:
      BIKEFLOW_MODEL_PATH: /models/model.joblib
    volumes:
      - ./models/model.joblib:/models/model.joblib:ro
      # Named volume keeps the prediction journal across container restarts.
      - journal:/var/lib/bikeflow
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      target: ui
    image: bikeflow-ui:local
    environment:
      BIKEFLOW_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Local demo: the dashboard opens without a login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  journal:
